<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeyBeauty CRM</title><style>body{margin:0;background:#f7f7fb;color:#262433;font-family:Arial,"Malgun Gothic",sans-serif}header{background:#262433;color:white;padding:20px max(20px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center}a{color:white;text-decoration:none}main{max-width:1120px;margin:28px auto;padding:0 18px}.tabs{display:flex;gap:8px;margin-bottom:16px}button{border:1px solid #dedce8;background:white;padding:9px 13px;border-radius:8px;cursor:pointer}.active{background:#ff7597;color:white;border-color:#ff7597}.card{background:white;border-radius:14px;padding:20px;box-shadow:0 1px 3px #00000010}.summary{color:#767188;margin:5px 0 22px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:13px 8px;border-bottom:1px solid #eee}th{color:#767188;font-weight:500}select{border:1px solid #ddd;border-radius:6px;padding:7px;background:white}.tag{font-size:12px;background:#fff0f4;color:#d74f70;padding:5px 8px;border-radius:12px}@media(max-width:620px){table{font-size:12px}th:nth-child(5),td:nth-child(5){display:none}}</style></head><body><header><strong>heybeauty · 클리닉 CRM</strong><a href="/">사용자 화면 보기 →</a></header><main><div class="tabs" id="tabs"></div><div class="card"><h2 id="title" style="margin-top:0"></h2><p class="summary">HeyBeauty 채팅에서 수집한 고객 정보와 예약 요청을 한 곳에서 관리합니다.</p><table><thead><tr><th>고객</th><th>연락처</th><th>관심/고민</th><th>예약 서비스</th><th>예약 시간</th><th>상태</th></tr></thead><tbody id="list"></tbody></table></div></main><script>const clinics=[1,2,3],tabs=document.getElementById('tabs'),title=document.getElementById('title'),list=document.getElementById('list');let current=1;function esc(x){const d=document.createElement('div');d.textContent=x||'-';return d.innerHTML}async function load(id){current=id;const d=await (await fetch('/api/crm?clinic_id='+id)).json();title.textContent=d.clinic.name+' 고객 관리';tabs.innerHTML=clinics.map((x,i)=>`<button class="${x===id?'active':''}" onclick="load(${x})">${['라이트 피부과','루미에르 클리닉','온유 메디컬'][i]}</button>`).join('');list.innerHTML=d.appointments.map(a=>`<tr><td><b>${esc(a.customer_name)}</b><br><span class="tag">${esc(a.source)}</span></td><td>${esc(a.phone)}</td><td>${esc(a.concern)}</td><td>${esc(a.service_name)}</td><td>${esc(a.slot)}</td><td><select onchange="changeStatus(${a.id},this.value)">${['상담대기','예약확정','방문완료','취소'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6">예약이 없습니다.</td></tr>'}async function changeStatus(id,status){await fetch('/api/appointments/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load(current)}load(1)</script></body></html>
