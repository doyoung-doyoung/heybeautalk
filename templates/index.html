<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeyBeauty</title><style>
:root{--ink:#282333;--muted:#776f84;--pink:#ff7597;--bg:#fff7fa;--line:#f0dce3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Malgun Gothic",sans-serif;color:var(--ink)}header{height:68px;background:#fff;display:flex;align-items:center;padding:0 max(22px,calc((100% - 1100px)/2));justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:800}.brand b{color:var(--pink)}a{color:inherit;text-decoration:none}.crm{border:1px solid var(--line);padding:9px 13px;border-radius:20px;font-size:14px}main{max-width:1100px;margin:30px auto;display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.hero{padding:30px;background:linear-gradient(135deg,#fff0f4,#f8f2ff)}h1{font-size:30px;margin:0 0 10px}p{line-height:1.55;color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button{cursor:pointer;border:0}.chip{background:#fff;border:1px solid var(--line);border-radius:18px;padding:9px 12px}.chat{height:530px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:18px}.bubble{max-width:85%;padding:12px 14px;margin:8px 0;border-radius:14px;line-height:1.55;font-size:14px;white-space:pre-wrap}.me{background:#ffe1e9;margin-left:auto}.ai{background:#f5f3f8}.input{display:flex;padding:14px;border-top:1px solid var(--line);gap:8px}.input input{flex:1;border:1px solid var(--line);border-radius:22px;padding:12px}.send{background:var(--pink);color:#fff;border-radius:22px;padding:0 18px}.cards{padding:18px}.service{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.service h3{margin:0 0 5px;font-size:16px}.meta{font-size:13px;color:var(--muted)}.book{background:var(--ink);color:#fff;padding:9px 12px;border-radius:8px;margin-top:12px}.empty{color:var(--muted);font-size:14px}dialog{border:0;border-radius:18px;padding:0;max-width:440px;width:calc(100% - 30px);box-shadow:0 15px 50px #0004}dialog::backdrop{background:#0005}.form{padding:24px}.form h2{margin-top:0}.form input,.form select{display:block;width:100%;margin:8px 0 14px;padding:11px;border:1px solid var(--line);border-radius:8px}.actions{display:flex;gap:8px;justify-content:flex-end}.secondary{background:#eee;padding:10px 14px;border-radius:8px}.primary{background:var(--pink);color:#fff;padding:10px 14px;border-radius:8px}@media(max-width:760px){main{grid-template-columns:1fr;margin-top:16px}.hero{display:none}.chat{height:470px}}
</style></head><body><header><div class="brand">hey<b>beauty</b></div><a class="crm" href="/crm">클리닉 CRM 데모 →</a></header><main><section class="panel hero"><h1>내 피부 고민을<br>대화로 찾아보세요.</h1><p>AI가 뷰티 정보를 안내하고, 입점 클리닉의 가능한 예약 시간까지 연결해 드려요.</p><div class="chips"><button class="chip" onclick="send('사각턱 보톡스가 궁금해요')">사각턱 보톡스</button><button class="chip" onclick="send('건조한 피부에 추천해줘')">건조한 피부</button><button class="chip" onclick="send('색소 레이저를 알아보고 싶어요')">색소 레이저</button></div></section><section class="panel chat"><div class="messages" id="messages"><div class="bubble ai">안녕하세요, 헤이뷰티예요. 피부 고민이나 궁금한 시술을 편하게 말씀해 주세요. 이름과 연락처를 알려주시면 예약할 때 자동으로 입력해 드릴게요.</div></div><div class="input"><input id="message" placeholder="예: 저는 김하늘이고 010-0000-0000이에요" autofocus><button class="send" onclick="send()">보내기</button></div></section><section class="panel" style="grid-column:1/-1"><div class="cards"><strong>AI 추천 서비스</strong><div id="services" class="empty" style="margin-top:12px">대화를 시작하면 맞춤 서비스를 보여드려요.</div></div></section></main><dialog id="booking"><form class="form" id="bookingForm"><h2 id="bookingTitle">예약 요청</h2><input type="hidden" id="serviceId"><label>예약자 이름<input id="name" required></label><label>연락처<input id="phone" placeholder="010-0000-0000" required></label><label>피부 고민<input id="concern"></label><label>예약 가능 시간<select id="slot" required></select></label><div class="actions"><button type="button" class="secondary" onclick="booking.close()">취소</button><button class="primary">예약 요청</button></div></form></dialog><script>
const userId='demo-'+(localStorage.hbUserId||(localStorage.hbUserId=Math.random().toString(36).slice(2)));let current=[];const $=id=>document.getElementById(id);function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function add(text,type){$('messages').insertAdjacentHTML('beforeend',`<div class="bubble ${type}">${esc(text)}</div>`);$('messages').scrollTop=99999}async function send(text){const input=$('message');text=text||input.value.trim();if(!text)return;add(text,'me');input.value='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,user_id:userId})});const d=await r.json();add(d.reply,'ai');['name','phone','concern'].forEach(k=>{if(d.profile[k])$(k).value=d.profile[k]});current=d.services;render(d.services)}catch(e){add('잠시 문제가 생겼어요. 다시 시도해 주세요.','ai')}}function render(items){$('services').innerHTML=items.map((s,i)=>`<div class="service"><h3>${esc(s.clinic_name)} · ${esc(s.name)}</h3><div class="meta">${esc(s.district)} · ${s.category} · ${s.price.toLocaleString()}원 · ${s.duration}</div><button class="book" onclick="openBooking(${i})">예약 시간 보기</button></div>`).join('')}function openBooking(i){const s=current[i];$('serviceId').value=s.id;$('bookingTitle').textContent=s.clinic_name+' 예약 요청';$('slot').innerHTML=s.slots.map(x=>`<option>${x}</option>`).join('');booking.showModal()}$('bookingForm').onsubmit=async e=>{e.preventDefault();const data={service_id:+$('serviceId').value,slot:$('slot').value,name:$('name').value,phone:$('phone').value,concern:$('concern').value};const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)return alert(d.error);booking.close();add('✅ '+d.message,'ai')};$('message').onkeydown=e=>{if(e.key==='Enter')send()};
</script></body></html>
